#
# HTTPS for the single-server installation: a proxy in front of the gateway
# that gets a certificate for your domain and renews it by itself.
#
# Used together with docker-compose.yml. Put this line into .env, and every
# "docker compose" command in this folder includes it from then on:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.tls.yml
#
# It needs ONYX_DOMAIN in .env, the domain pointing at this server, and the
# ports 80 and 443 reachable from the internet.

services:
  # With the proxy in front there are two of them before the API: the proxy
  # and the gateway. The API counts them to find the address of the viewer,
  # which the audit log, the sign-in limit and every rate limit go by.
  api:
    environment:
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}

  tls:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ONYX_DOMAIN: ${ONYX_DOMAIN:?Set ONYX_DOMAIN in .env to the domain of the site}
    ports:
      - '80:80'
      - '443:443'
      # HTTP/3
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates. Losing them only means fetching new ones.
      - tls-data:/data
      - tls-config:/config
    depends_on:
      gateway:
        condition: service_started

volumes:
  tls-data:
  tls-config:
