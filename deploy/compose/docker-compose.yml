# SPDX-License-Identifier: AGPL-3.0-only
#
# Spark Onyx Stream on a single server.
#
#   ./init-env.sh                 # once: writes .env with fresh secrets
#   docker compose up -d --build  # builds the images and starts everything
#
# Then open http://<server>:8080/admin and create the first admin.
# The site for viewers is at http://<server>:8080.
# See README.md in this folder for updates, backups and TLS.

name: onyx

x-app: &app
  image: onyx-stream/api:local
  build:
    context: ../..
    target: api
  restart: unless-stopped
  environment: &app-environment
    NODE_ENV: production
    DATABASE_URL: postgresql://${POSTGRES_USER:-onyx}:${POSTGRES_PASSWORD:?Run ./init-env.sh first}@postgres:5432/${POSTGRES_DB:-onyx}
    REDIS_URL: redis://redis:6379
    JWT_SECRET: ${JWT_SECRET:?Run ./init-env.sh first}
    PLAYBACK_SIGNING_SECRET: ${PLAYBACK_SIGNING_SECRET:?Run ./init-env.sh first}
    MASTER_KEY: ${MASTER_KEY:?Run ./init-env.sh first}
    INGEST_API_URL: http://ingest:9997
    INGEST_RTSP_URL: rtsp://ingest:8554
    INGEST_PUBLIC_RTMP_URL: ${INGEST_PUBLIC_RTMP_URL:-}
    INGEST_PUBLIC_SRT_URL: ${INGEST_PUBLIC_SRT_URL:-}
    GUIDE_REFRESH_HOURS: ${GUIDE_REFRESH_HOURS:-6}
    PLAYBACK_URL_TTL_SECONDS: ${PLAYBACK_URL_TTL_SECONDS:-21600}
    CATALOG_PLAYBACK: ${CATALOG_PLAYBACK:-open}
    VIEWER_REGISTRATION: ${VIEWER_REGISTRATION:-open}
    VIEWER_EMAIL_VERIFICATION: ${VIEWER_EMAIL_VERIFICATION:-optional}
    SMTP_URL: ${SMTP_URL:-}
    BILLING_CURRENCY: ${BILLING_CURRENCY:-EUR}
    BILLING_CONTACT_URL: ${BILLING_CONTACT_URL:-}
    RENTAL_START_DAYS: ${RENTAL_START_DAYS:-30}
    RENTAL_WATCH_HOURS: ${RENTAL_WATCH_HOURS:-48}
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    STRIPE_AUTOMATIC_TAX: ${STRIPE_AUTOMATIC_TAX:-false}
    TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
    METADATA_LANGUAGE: ${METADATA_LANGUAGE:-en-US}
    METADATA_REGION: ${METADATA_REGION:-US}
    MAIL_FROM: ${MAIL_FROM:-}
    SITE_URL: ${SITE_URL:-http://localhost:8080}
    SITE_NAME: ${SITE_NAME:-Onyx Stream}
    UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-53687091200}
    MEDIA_BASE_URL: ${MEDIA_BASE_URL:-}
    CORS_ORIGINS: ${CORS_ORIGINS:-}
    # The gateway is the one proxy in front of the API.
    TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onyx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./init-env.sh first}
      POSTGRES_DB: ${POSTGRES_DB:-onyx}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-onyx} -d ${POSTGRES_DB:-onyx}']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # The queue must survive a restart, so every write is kept on disk.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Brings the database to the version of the images, then ends.
  migrate:
    <<: *app
    restart: 'no'
    working_dir: /app/packages/database
    command: ['pnpm', 'exec', 'prisma', 'migrate', 'deploy']
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-environment
      APP_ROLE: api,scheduler
    volumes:
      - storage:/var/lib/onyx/storage
      - uploads:/var/lib/onyx/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/v1/health/live').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Runs FFmpeg. Start more of them with: docker compose up -d --scale worker=2
  worker:
    <<: *app
    environment:
      <<: *app-environment
      APP_ROLE: worker
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
    volumes:
      - storage:/var/lib/onyx/storage
      - processing:/var/lib/onyx/processing
    # Gives a running job time to stop cleanly.
    stop_grace_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Keeps the live channels running: one FFmpeg process per channel.
  live:
    <<: *app
    environment:
      <<: *app-environment
      APP_ROLE: live
      LIVE_SEGMENT_SECONDS: ${LIVE_SEGMENT_SECONDS:-4}
      LIVE_PLAYLIST_SEGMENTS: ${LIVE_PLAYLIST_SEGMENTS:-6}
      LIVE_TRANSCODE_PRESET: ${LIVE_TRANSCODE_PRESET:-veryfast}
    volumes:
      - live:/var/lib/onyx/live
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Receives the streams encoders push to live channels (MediaMTX). It asks the
  # API before it lets a connection in. Only the two ports for encoders are
  # published: reading streams and the control API stay in the internal network.
  ingest:
    image: bluenviron/mediamtx:1.21.4
    restart: unless-stopped
    environment:
      MTX_AUTHHTTPADDRESS: http://api:3000/v1/live/ingest/auth
    volumes:
      - ../mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - '${INGEST_RTMP_PORT:-1935}:1935'
      - '${INGEST_SRT_PORT:-8890}:8890/udp'
    depends_on:
      api:
        condition: service_healthy

  # The site viewers use. It reads the catalog from the API.
  web:
    image: onyx-stream/web:local
    build:
      context: ../..
      target: web
    restart: unless-stopped
    environment:
      WEB_SITE_NAME: ${SITE_NAME:-Onyx Stream}
      WEB_SITE_DESCRIPTION: ${SITE_DESCRIPTION:-Movies and series, streamed to you.}
      WEB_SITE_URL: ${SITE_URL:-http://localhost:8080}
      WEB_API_URL: http://api:3000
      WEB_MEDIA_ORIGIN: ${MEDIA_BASE_URL:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/robots.txt').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  gateway:
    image: onyx-stream/gateway:local
    build:
      context: ../..
      target: gateway
    restart: unless-stopped
    environment:
      PLAYBACK_SIGNING_SECRET: ${PLAYBACK_SIGNING_SECRET:?Run ./init-env.sh first}
    ports:
      - '${HTTP_PORT:-8080}:8080'
    volumes:
      # Read-only: the gateway sends media files and never changes them.
      - storage:/var/lib/onyx/storage:ro
      - live:/var/lib/onyx/live:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  storage:
  uploads:
  processing:
  live:
