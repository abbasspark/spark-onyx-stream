# Headers for the television app. Included by the /tv/ locations in nginx.conf.
#
# Like the admin panel, with two differences. Pictures and video may come from
# any https or http host, because the video of a title can be delivered by an
# edge server on another address and the television cannot be told which
# before it asks. What it plays is only ever an address the API has signed.
# Scripts stay limited to the app's own files.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
