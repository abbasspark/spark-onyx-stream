# Passes a request on to the API. Included by the locations in nginx.conf.
proxy_pass http://onyx_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $onyx_forwarded_proto;
