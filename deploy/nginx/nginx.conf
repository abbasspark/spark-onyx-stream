# SPDX-License-Identifier: AGPL-3.0-only
#
# Gateway of a single-server installation. It answers four kinds of requests:
#
#   /v1/live/...   playlists and segments of live channels, served from the
#                  live folder after the same token check
#   /v1/media/...  media files, served from the storage folder after the
#                  playback token was checked here, without asking the API
#   /v1/...        the API, passed on to the api container
#   /admin/...     the admin panel (static files)
#   everything else the viewer website, passed on to the web container
#
# TLS is expected to end in front of this gateway (a load balancer, Caddy,
# Traefik or a host Nginx with certificates).

load_module modules/ngx_http_js_module.so;

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

# The token script reads the signing secret from the environment.
env PLAYBACK_SIGNING_SECRET;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Playback tokens are part of the path, so the path is not written to the log.
    log_format onyx '$remote_addr [$time_local] "$request_method $onyx_log_path" '
                    '$status $body_bytes_sent ${request_time}s';
    map $uri $onyx_log_path {
        ~^(?<start>/v1/(?:media|live)/[^/]+/)[^/]+(?<rest>/.*)$ "${start}<token>${rest}";
        default $uri;
    }
    access_log /dev/stdout onyx;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Writable paths for a container that does not run as root.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/vnd.apple.mpegurl text/vtt;
    gzip_min_length 1024;
    # Pages of the website come from another container and are compressed here.
    gzip_proxied any;

    # Keeps the scheme a TLS proxy in front reported, and falls back to our own.
    map $onyx_live_type $onyx_live_cache {
        m3u8    "no-cache, no-store";
        default "private, max-age=60";
    }

    map $http_x_forwarded_proto $onyx_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    js_import media from /etc/nginx/njs/media.js;
    js_set $onyx_media_ok media.verify;

    upstream onyx_api {
        server api:3000;
        keepalive 32;
    }

    upstream onyx_web {
        server web:3001;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        # --- Media: the content key of an encrypted asset ----------------------
        # Never a file. The API checks the token and the asset and sends the key.
        location ~ ^/v1/media/[^/]+/[^/]+/hls/key$ {
            include /etc/nginx/proxy-api.conf;
        }

        # --- Media: playlists, segments, subtitles and pictures ----------------
        location ~ ^/v1/media/(?<onyx_asset_id>[0-9a-f-]+)/(?<onyx_token>[0-9]+\.[A-Za-z0-9_-]+)/(?<onyx_file>(?:hls|thumbs)/[A-Za-z0-9._/-]+)$ {
            # Players on any website may read media. The signed URL is the permission.
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
            add_header Access-Control-Max-Age "600" always;
            add_header Cache-Control "private, max-age=3600";
            add_header X-Content-Type-Options "nosniff" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
            if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
            }
            # Every refusal looks the same, as it does in the API.
            if ($onyx_media_ok != "1") {
                return 404;
            }

            types {
                application/vnd.apple.mpegurl m3u8;
                video/iso.segment            m4s;
                video/mp4                    mp4;
                video/mp2t                   ts;
                text/vtt                     vtt;
                image/jpeg                   jpg jpeg;
                image/webp                   webp;
                image/png                    png;
            }
            default_type application/octet-stream;

            # Files of the local storage pool are sent straight from disk. Anything
            # not found there, such as an asset in an S3 pool, is left to the API.
            root /var/lib/onyx/storage/assets;
            try_files /$onyx_asset_id/$onyx_file @api_media;
        }

        location @api_media {
            include /etc/nginx/proxy-api.conf;
        }

        # Any other media address goes to the API, which refuses what is not valid.
        location /v1/media/ {
            include /etc/nginx/proxy-api.conf;
        }

        # --- Live: playlists and segments of running channels -------------------
        # The live processes write them to a folder the gateway reads. The token
        # is the one used for video on demand, signed over the id of the channel.
        location ~ ^/v1/live/(?<onyx_asset_id>[0-9a-f-]+)/(?<onyx_token>[0-9]+\.[A-Za-z0-9_-]+)/(?<onyx_live_file>[A-Za-z0-9_-]+\.(?<onyx_live_type>m3u8|mp4|m4s))$ {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
            add_header Access-Control-Max-Age "600" always;
            # The playlist of a channel that keeps hours is long and asked for every few
            # seconds by every viewer. Packed, it is a tenth of the size.
            gzip on;
            gzip_types application/vnd.apple.mpegurl;

            # A playlist changes with every segment. A segment never changes.
            add_header Cache-Control $onyx_live_cache;
            add_header X-Content-Type-Options "nosniff" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
            if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
            }
            if ($onyx_media_ok != "1") {
                return 404;
            }

            types {
                application/vnd.apple.mpegurl m3u8;
                video/iso.segment            m4s;
                video/mp4                    mp4;
            }
            default_type application/octet-stream;

            # A channel that does not run has no files, which is a 404 here as well.
            root /var/lib/onyx/live;
            try_files /$onyx_asset_id/$onyx_live_file =404;
        }

        # Any other live address goes to the API, which refuses what is not valid.
        location /v1/live/ {
            include /etc/nginx/proxy-api.conf;
        }

        # --- Uploads: large bodies, passed on as they arrive --------------------
        location /v1/uploads {
            client_max_body_size 0;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            include /etc/nginx/proxy-api.conf;
        }

        # --- The rest of the API -------------------------------------------------
        location /v1/ {
            client_max_body_size 1m;
            include /etc/nginx/proxy-api.conf;
        }

        # --- Admin panel ---------------------------------------------------------
        # The files are in /usr/share/nginx/html/admin, so the address and the
        # path on disk are the same.
        root /usr/share/nginx/html;

        location = /admin {
            return 308 /admin/;
        }

        # Built files under /admin/assets carry a hash of their content in the
        # name, so browsers may keep them. The pattern asks for a file extension,
        # because the panel also has pages under /admin/assets (the library).
        location ~ ^/admin/assets/[^/]+\.[a-z0-9]+$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        location /admin/ {
            add_header Cache-Control "no-cache";
            include /etc/nginx/security-headers.conf;
            try_files $uri /admin/index.html;
        }

        # --- Viewer website ------------------------------------------------------
        # The website sets its own security headers, with a policy made for each page.
        location / {
            include /etc/nginx/proxy-web.conf;
        }
    }
}
