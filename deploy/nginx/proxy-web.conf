# Passes a request on to the viewer website. Included by nginx.conf.
proxy_pass http://onyx_web;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $onyx_forwarded_proto;
# Pages are sent as they are built, so the first part arrives early.
proxy_buffering off;
