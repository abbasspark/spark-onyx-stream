# SPDX-License-Identifier: AGPL-3.0-only
#
# An edge server of Spark Onyx Stream: the edge agent, with Caddy in front of
# it for HTTPS. Caddy gets and renews the certificate by itself, for which the
# domain must point to this server and ports 80 and 443 must be reachable.
#
#   cp .env.example .env    # then fill it in
#   docker compose up -d --build
#
# See docs/phase-5-edges.md.

services:
  agent:
    build:
      context: ../../services/edge-agent
    image: onyx-edge-agent
    restart: unless-stopped
    environment:
      ONYX_ORIGIN_URL: ${ONYX_ORIGIN_URL:?Set ONYX_ORIGIN_URL in .env}
      ONYX_EDGE_TOKEN: ${ONYX_EDGE_TOKEN:?Set ONYX_EDGE_TOKEN in .env}
      ONYX_EDGE_CACHE_SIZE: ${ONYX_EDGE_CACHE_SIZE:-50GB}
    volumes:
      - cache:/var/lib/onyx-edge
    # Reached only through Caddy.
    expose:
      - '8080'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - agent
    environment:
      EDGE_DOMAIN: ${EDGE_DOMAIN:?Set EDGE_DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  cache:
  caddy-data:
  caddy-config:
