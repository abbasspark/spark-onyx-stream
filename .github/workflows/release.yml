name: Release

# Pushing a tag such as v0.2.0 builds the images and publishes them to the
# GitHub container registry, then creates the release with its notes.
#
# A pull request that changes this file only builds the images, to show that
# the workflow works. Nothing is published from it.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          packaged=$(node -p "require('./apps/api/package.json').version")
          echo "version=$packaged" >> "$GITHUB_OUTPUT"
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" != "tag" ]; then
            exit 0
          fi
          tagged="${REF_NAME#v}"
          if [ "$tagged" != "$packaged" ]; then
            echo "::error::The tag is $REF_NAME but apps/api/package.json says $packaged. Change the version, merge it, and tag again."
            exit 1
          fi
          case "$tagged" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
          esac

  images:
    name: Image (${{ matrix.image }})
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            target: api
          - image: web
            context: .
            target: web
          - image: gateway
            context: .
            target: gateway
          - image: tracker
            context: services/tracker
          - image: edge-agent
            context: services/edge-agent
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Name the image
        id: name
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/spark-onyx-stream-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.name.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.version.outputs.prerelease == 'false' }}
            type=semver,pattern={{major}},enable=${{ needs.version.outputs.prerelease == 'false' && !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && needs.version.outputs.prerelease == 'false' }}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    name: Create the release
    if: github.event_name == 'push'
    needs: [version, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=(--verify-tag --generate-notes --title "$TAG")
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "${flags[@]}"
