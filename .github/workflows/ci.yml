name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Format, types, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Prisma needs the variable to generate its client, but never connects.
      DATABASE_URL: postgresql://onyx:unused@localhost:5432/onyx
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: API end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: onyx
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: onyx
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U onyx -d onyx"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://onyx:change-me@localhost:5432/onyx
      TEST_DATABASE_URL: postgresql://onyx:change-me@localhost:5432/onyx_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-0000000000000000000000000000000000
      PLAYBACK_SIGNING_SECRET: ci-playback-secret-00000000000000000000000000
      MASTER_KEY: ci-master-key-000000000000000000000000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Create the test database
        run: PGPASSWORD=change-me psql -h localhost -U onyx -d onyx -c 'CREATE DATABASE onyx_test'
      - run: pnpm test:e2e

  go:
    name: Go services
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        service: [tracker, edge-agent]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache: false
      - run: go vet ./...
      - run: go test ./...

  installer:
    name: Installer tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash deploy/installer/tests/run.sh

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate the Compose file
        working-directory: deploy/compose
        run: |
          ./init-env.sh
          docker compose config --quiet
      - name: Build the images
        working-directory: deploy/compose
        run: docker compose build

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test lint --no-daemon
