name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because new kinds of problems are added to the scan over time.
    - cron: '23 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: none
          - language: actions
            build-mode: none
          - language: go
            build-mode: manual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version-file: services/tracker/go.mod
          cache: false
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build the Go services
        if: matrix.language == 'go'
        run: |
          for service in services/edge-agent services/tracker; do
            (cd "$service" && go build ./...)
          done
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
