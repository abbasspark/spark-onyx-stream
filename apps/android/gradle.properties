org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# What an operator building their own copy changes. Each can also be passed
# on the command line: -Ponyx.serverUrl=https://stream.example.com
onyx.applicationId=de.sparksystem.onyx.tv
onyx.mobileApplicationId=de.sparksystem.onyx
onyx.appName=Onyx
# The address the app connects to. Left empty, the app asks on first run.
onyx.serverUrl=
